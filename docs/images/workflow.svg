<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#071019"/><g font-family="Arial"><text x="80" y="75" fill="#fff" font-size="42" font-weight="700">Three Clean Flows · Három külön útvonal</text><g transform="translate(90 160)"><rect width="1420" height="180" rx="24" fill="#0b1b28" stroke="#14d9ff"/><text x="32" y="48" fill="#14d9ff" font-size="24" font-weight="700">1 · Refine + Sell / Finomítás + Eladás</text><text x="32" y="90" fill="#fff" font-size="19">Select ship → resolve Rubble/Pieces/Salvage → recovery + refinery bonus → access → CMAT sale</text><text x="32" y="128" fill="#9db6c1" font-size="16">Ship required · ship-dependent economics and access</text></g><g transform="translate(90 385)"><rect width="1420" height="180" rx="24" fill="#0b1b28" stroke="#4caf50" stroke-width="2"/><text x="32" y="48" fill="#4caf50" font-size="24" font-weight="700">2 · CMAT Sell Only / Csak Eladás</text><text x="32" y="90" fill="#fff" font-size="19">Finished CMAT SCU → price ranking → direct UEX terminal demand link</text><text x="32" y="128" fill="#c5dfd0" font-size="16">No recovery · no ship required · no ship filter · deterministic ship-independent order</text></g><g transform="translate(90 610)"><rect width="1420" height="180" rx="24" fill="#0b1b28" stroke="#14d9ff"/><text x="32" y="48" fill="#14d9ff" font-size="24" font-weight="700">3 · RMC Selling / RMC eladás</text><text x="32" y="90" fill="#fff" font-size="19">Finished RMC SCU → selected-ship access filter → price ranking → UEX terminal demand link</text><text x="32" y="128" fill="#9db6c1" font-size="16">Ship selection remains relevant for physical access</text></g></g></svg>